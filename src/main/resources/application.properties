spring.application.name=final

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rutaia}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# n8n webhooks
rutaia.n8n.sync-webhook-url=${N8N_SYNC_URL:http://localhost:5678/webhook/curso-sync}
rutaia.n8n.query-webhook-url=${N8N_QUERY_URL:http://localhost:5678/webhook/rag-query}

# CORS
rutaia.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
