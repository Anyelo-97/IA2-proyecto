spring.application.name=final

# Import environment configuration from resources .env
spring.config.import=optional:file:.env[.properties],optional:file:src/main/resources/.env[.properties],optional:classpath:.env[.properties]

# MySQL Datasource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rutaIA}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true

# SQL Initialization
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.schema-locations=${SQL_SCHEMA_LOCATION:optional:file:database/schema.sql,optional:classpath:schema.sql}
spring.sql.init.data-locations=${SQL_DATA_LOCATION:optional:file:database/data.sql,optional:classpath:data.sql}

# Swagger / OpenAPI
springdoc.swagger-ui.persistAuthorization=true

# n8n Webhooks
rutaia.n8n.sync-webhook-url=${N8N_SYNC_URL:}
rutaia.n8n.query-webhook-url=${N8N_QUERY_URL:}
rutaia.n8n.webhook-secret=${N8N_WEBHOOK_SECRET:}

# CORS Configuration
rutaia.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500}

# Auth Admin Registration
rutaia.auth.admin-registration-code=${ADMIN_REGISTRATION_CODE:}

# JWT Security
rutaia.jwt.secret=${JWT_SECRET:}
rutaia.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
